name: Procedural material graph validation

on:
  push:
    paths:
      - extensions/2.0/Khronos/KHR_texture_procedurals/**
      - extensions/2.0/Vendor/EXT_texture_procedurals_mx_1_39/**
      - specification/2.0/schema/**
      - .github/workflows/texture-procedurals.yml
  pull_request:
    paths:
      - extensions/2.0/Khronos/KHR_texture_procedurals/**
      - extensions/2.0/Vendor/EXT_texture_procedurals_mx_1_39/**
      - specification/2.0/schema/**
      - .github/workflows/texture-procedurals.yml

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extensions/2.0/Khronos/KHR_texture_procedurals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/2.0/Khronos/KHR_texture_procedurals/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run validate
